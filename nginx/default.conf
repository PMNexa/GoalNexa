# Single external entrypoint for apps/main: /api/* and /admin/* go to the
# backend, everything else (including Vite's HMR websocket) goes to the
# frontend dev server.
server {
    listen 80;

    location /api/ {
        proxy_pass http://main-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://main-backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://main-frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
