# Single external entrypoint for the whole platform. Path prefixes here
# mirror modules.yaml's url_prefix per module - if you add a module there,
# add its two location blocks here too (api first, frontend second).
#
# nginx matches the LONGEST prefix location, so declaration order below
# doesn't matter for correctness, but is kept most-specific-first for
# readability.

server {
    listen 80;

    # platform-core's own backend - /api/... on this same port.
    location /api/ {
        proxy_pass http://platform-core-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # platform-auth's backend, mounted at its url_prefix - strips
    # "/platform-auth" and forwards the rest ("/api/v1/auth/login" etc.)
    # unchanged, matching that backend's own urls.py.
    location /platform-auth/api/ {
        proxy_pass http://platform-auth-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # platform-auth's frontend, mounted at its url_prefix. Vite is started
    # with --base=/platform-auth/ (see docker-compose.yml) so its own
    # asset/HMR URLs already expect this prefix - proxy_pass here does NOT
    # strip it.
    location /platform-auth/ {
        proxy_pass http://platform-auth-frontend:5173/platform-auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # platform-core's own frontend shell - the catch-all root.
    location / {
        proxy_pass http://platform-core-frontend:5174/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
