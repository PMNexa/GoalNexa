# Single external entrypoint: this is the only port exposed to the host.
#
# Routes:
#   /api/health -> backend's unprefixed GET /health (platform-core's health
#                  route is mounted with no prefix - see app/main.py - the
#                  one exception to the passthrough rule below)
#   /api/*      -> backend, passthrough for /api/v1/... routes (auth, orgs,
#                  RBAC, goals, ...) - platform-core's own main.py mounts
#                  every feature router under prefix="/api/v1", so the
#                  frontend's own request paths (e.g. `/api/v1/auth/login`)
#                  must reach the backend unchanged, not with /api stripped
#   /*          -> frontend dev server, including Vite's HMR websocket
server {
    listen 80;

    location /api/health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:30566;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
