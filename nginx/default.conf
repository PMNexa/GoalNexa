# Single external entrypoint for apps/main: /api/* and /admin/* go to the
# backend, everything else (including Vite's HMR websocket) goes to the
# frontend dev server.
# The scheme the client used: Tailscale serve/Funnel terminates HTTPS and
# sends X-Forwarded-Proto: https; a direct hit on :55607 is plain http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;

    # No trailing path on proxy_pass - passes the request URI through
    # UNCHANGED (not stripped). The backend's own urls.py registers
    # routes at "api/v1/auth/..." directly (matching platform_auth's own
    # standalone app's internal path/cookie-path expectations), so this
    # must forward "/api/..." as "/api/..." verbatim, not strip it to "/...".
    # X-Forwarded-For: the client's IP appended to whatever proxies before
    # this one sent - the auth rate limits count by it (Django's
    # TRUSTED_PROXY_COUNT says how many entries from the end to trust).
    location /api/ {
        proxy_pass http://main-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://main-backend:8000/admin/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The admin's CSS/JS (Django STATIC_URL) - served by the backend
    # (runserver in dev, WhiteNoise under gunicorn). The frontend's own
    # assets live under /assets/, so nothing else claims /static/.
    location /static/ {
        proxy_pass http://main-backend:8000;
        proxy_set_header Host $http_host;
    }

    # platform-mcp's OAuth discovery documents (for Claude connectors) -
    # the backend serves them at the site root. Caddy answers its own
    # ACME challenges before a request gets here.
    location /.well-known/oauth- {
        proxy_pass http://main-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        # Nothing embeds this app; refusing frames keeps pages like the
        # MCP consent page (/mcp/authorize) from being clickjacked.
        add_header X-Frame-Options DENY always;
        proxy_pass http://main-frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
