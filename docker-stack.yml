# Production on Docker Swarm (one node or many): the same services as
# docker-compose.prod.yml, from registry images instead of local builds,
# with rolling updates that start the new task before stopping the old one
# and roll back on a failed healthcheck. Deploy with scripts/deploy.sh -
# never `docker stack deploy` by hand: the script runs migrations first
# (Swarm has no depends_on) and fills in IMAGE_TAG/NGINX_CONF_VERSION.
#
# Both images live in ONE registry repository, `goalnexa`, told apart by
# tag (backend-<commit>, frontend-<commit>) - DigitalOcean's free registry
# allows a single repository.
#
# No database service: DATABASE_URL points at a managed Postgres (a volume
# pins a DB to one node, which would make it the cluster's single point of
# failure). The auth rate-limit cache lives in that same database, so every
# replica on every node shares one count.
#
# HTTPS: `caddy` (caddy/Caddyfile) takes ports 80/443 on the manager and
# gets a Let's Encrypt certificate for DOMAIN; everything behind it talks
# plain HTTP on the overlay network.
#
# First-time setup on the manager Droplet:
#   docker swarm init --advertise-addr <private VPC IP>
# More nodes later: `docker swarm join-token worker` on the manager, run the
# printed command on the new Droplet, point the load balancer at it too
# and raise BACKEND_REPLICAS/FRONTEND_REPLICAS. Caddy stays on the manager
# (its certificates live in a volume there), so with several nodes put TLS
# on a DO load balancer or Cloudflare instead.
version: "3.9"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Start the new task first, keep it only if it passes its healthcheck for
# `monitor`, else put the old version back.
x-rolling: &rolling
  update_config:
    order: start-first
    parallelism: 1
    delay: 5s
    monitor: 30s
    failure_action: rollback
  rollback_config:
    order: start-first
    parallelism: 1
  restart_policy:
    condition: any
    delay: 5s

services:
  main-backend:
    image: ${REGISTRY:?set REGISTRY}/goalnexa:backend-${IMAGE_TAG:?set IMAGE_TAG}
    logging: *logging
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (managed Postgres)}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
      GOALNEXA_EXTENSIONS: ${GOALNEXA_EXTENSIONS:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      AUTH_LOGIN_RATE: ${AUTH_LOGIN_RATE:-10/min}
      AUTH_LOGIN_EMAIL_RATE: ${AUTH_LOGIN_EMAIL_RATE:-20/hour}
      AUTH_SIGNUP_RATE: ${AUTH_SIGNUP_RATE:-10/hour}
      # Proxies appending to X-Forwarded-For in front of Django: caddy +
      # nginx = 2, plus one for Cloudflare or a DO load balancer in front.
      # Required - a wrong value silently puts every client under one
      # rate limit.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:?set TRUSTED_PROXY_COUNT}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip().lstrip('.'); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/admin/login/', headers={'Host': host}))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    networks: [goalnexa]
    deploy:
      <<: *rolling
      replicas: ${BACKEND_REPLICAS:-2}

  main-frontend:
    image: ${REGISTRY}/goalnexa:frontend-${IMAGE_TAG}
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [goalnexa]
    deploy:
      <<: *rolling
      replicas: ${FRONTEND_REPLICAS:-2}

  nginx:
    image: nginx:alpine
    logging: *logging
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    networks: [goalnexa]
    deploy:
      <<: *rolling
      replicas: 2

  # Bound to the node's own ports (mode: host) rather than Swarm's routing
  # mesh, which would replace the client's IP with an internal one - the
  # auth rate limits count by that IP. One replica, pinned to the manager
  # where its certificate volume lives; host ports can't be bound twice,
  # so an update stops the old task first (a second or two).
  caddy:
    image: caddy:2-alpine
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN (e.g. goalnexa.example.com)}
    ports:
      - {target: 80, published: 80, protocol: tcp, mode: host}
      - {target: 443, published: 443, protocol: tcp, mode: host}
      - {target: 443, published: 443, protocol: udp, mode: host}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [goalnexa]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s

configs:
  # Swarm configs are immutable - the name carries the file's hash so an
  # edited file becomes a new config (scripts/deploy.sh sets the versions).
  nginx_conf:
    name: goalnexa_nginx_${NGINX_CONF_VERSION:?set NGINX_CONF_VERSION}
    file: ./nginx/default.conf
  caddyfile:
    name: goalnexa_caddy_${CADDY_CONF_VERSION:?set CADDY_CONF_VERSION}
    file: ./caddy/Caddyfile

volumes:
  caddy_data:
  caddy_config:

networks:
  goalnexa:
    driver: overlay
    attachable: true
