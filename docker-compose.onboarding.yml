# A second, throwaway GoalNexa with an EMPTY database - for trying
# first-run onboarding (admin setup, then the org/goals/metrics wizard)
# without touching the real data:
#
#   docker compose -f docker-compose.onboarding.yml up -d     # http://localhost:55608
#   docker compose -f docker-compose.onboarding.yml down -v   # wipe it, start over
#
# Its own project, network and database volume; it reuses the main
# stack's installed venv/node_modules (start that one at least once
# first) and runs the frontend as the Vite dev server (hot reload). Own
# refresh-cookie name, since cookies ignore the port - logging in here
# doesn't log you out of :55607.
name: goalnexa-onboarding

services:
  main-backend:
    image: python:3.12-slim
    working_dir: /apps/main/backend
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: onboarding-dev-only
      JWT_SECRET: onboarding-dev-only-jwt-secret
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_DB_PATH: /data/db.sqlite3
      REFRESH_COOKIE_NAME: onboarding_refresh_token
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps:/apps
      - main-backend-venv:/apps/main/backend/.venv
      - onboarding-db:/data
    command: sh -c ". .venv/bin/activate && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/')"]
      interval: 3s
      timeout: 3s
      retries: 100
      start_period: 5s

  main-frontend:
    image: node:22
    working_dir: /apps/main/frontend
    environment:
      FRONTEND_ALLOWED_HOSTS: ".ts.net"
      PORT: "3000"
    depends_on:
      - main-backend
    volumes:
      - ./apps:/apps
      - main-frontend-node-modules:/apps/main/frontend/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000

  nginx:
    image: nginx:alpine
    depends_on:
      main-backend:
        condition: service_healthy
      main-frontend:
        condition: service_started
    ports:
      - "55608:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  onboarding-db:
  # The main stack's (project "goalnexa") - installed deps only, no data.
  main-backend-venv:
    external: true
    name: goalnexa_main-backend-venv
  main-frontend-node-modules:
    external: true
    name: goalnexa_main-frontend-node-modules
