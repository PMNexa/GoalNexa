[project]
name = "goalnexa-backend"
version = "0.1.0"
description = "GoalNexa: a self-hosted goal/habit/OKR tracker backend (personal + team use)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "passlib[argon2]>=1.7",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "uuid6>=2024.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests share one module-level AsyncSessionLocal/asyncpg engine
# (app/db/session.py) across every test. asyncpg connections are bound to the
# event loop that first used them and cannot be reused from a different loop.
# pytest-asyncio's default is a fresh loop per test function, which breaks
# that shared engine with "another operation is in progress" errors. Session-
# scoped loops keep the whole run on one loop, matching a real running server.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` as a default arg is the whole point of the framework.
# UP042: `class Foo(str, enum.Enum)` (not `enum.StrEnum`) matches this project's
# convention for JSON/DB-serializable enums and is kept intentionally.
ignore = ["B008", "UP042"]
