[project]
name = "goalnexa-backend-ext"
version = "0.1.0"
description = """
GoalNexa backend extension: the `Goal` entity, on top of the platform-core
submodule (auth/orgs/RBAC/generic CRUD factory). Consumes platform-core "in
place" via PYTHONPATH, not a copy — see README.md.
"""
requires-python = ">=3.11"
# Matches apps/platform-core/backend/pyproject.toml's own dependency list
# exactly. platform-core's `app` package is added to PYTHONPATH as source
# (see README.md), not pip-installed as a separate distribution, so its own
# runtime dependencies must be present in this same environment for its
# imports to resolve.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "passlib[argon2]>=1.7",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "uuid6>=2024.1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goalnexa_ext*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests share one module-level AsyncSessionLocal/asyncpg engine
# (app/db/session.py) across every test. asyncpg connections are bound to the
# event loop that first used them and cannot be reused from a different loop.
# pytest-asyncio's default is a fresh loop per test function, which breaks
# that shared engine with "another operation is in progress" errors. Session-
# scoped loops keep the whole run on one loop, matching a real running server.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` as a default arg is the whole point of the framework.
# UP042: `class Foo(str, enum.Enum)` (not `enum.StrEnum`) matches this project's
# convention for JSON/DB-serializable enums and is kept intentionally.
ignore = ["B008", "UP042"]
