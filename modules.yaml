# Modules composed into this platform, as submodules under apps/.
#
# Static for now - a human/tooling-readable list of what's wired in. See
# docs/architecture/microservices-design.md for the planned dynamic version
# of this (POST /internal/modules/register at runtime); this file is
# today's stand-in. Read by platform-core's backend (GET /api/modules, via
# MODULES_MANIFEST_PATH) and its frontend shell (which links to each
# module's url_prefix - same origin, single port, see nginx/default.conf).

modules:
  - name: platform-core
    kind: kernel
    path: apps/platform-core
    repo: https://github.com/EugeneNguyen/platform-core.git
    enabled: true

  - name: platform-auth
    kind: module
    path: apps/platform-auth
    repo: https://github.com/EugeneNguyen/platform-auth.git
    # Path this module is mounted at behind the single-port gateway -
    # nginx/default.conf proxies "/platform-auth/" to this module's
    # frontend and "/platform-auth/api/" to its backend's own "/api/".
    url_prefix: /platform-auth
    # Module Federation remote entry - platform-core's frontend loads
    # this at runtime (see src/lib/remoteComponents.tsx) to render this
    # module's exposed components inline, no page navigation. Path is
    # relative (resolved against whatever origin the browser loaded the
    # shell from), matching url_prefix's own convention.
    remote_entry: /platform-auth/remoteEntry.js
    enabled: true
