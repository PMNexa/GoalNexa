# Production stack: built images (apps/main/{backend,frontend}/Dockerfile),
# gunicorn + react-router-serve, Postgres, and the same single-port nginx
# as docker-compose.yml (nginx/default.conf). No source mounts, no
# installs at boot. Config from .env (see .env.sample):
#   docker compose -f docker-compose.prod.yml up -d --build
# `up` runs `migrate` once before the backend starts. With a managed
# Postgres instead, set DATABASE_URL and drop the `db` service (or leave
# it unused). HTTPS goes in front of nginx - a host proxy/load balancer,
# Cloudflare, or the tailscale service from docker-compose.yml.
x-backend: &backend
  build:
    context: .
    dockerfile: apps/main/backend/Dockerfile
  image: goalnexa-backend
  restart: unless-stopped
  environment:
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
    DATABASE_URL: ${DATABASE_URL:-postgres://goalnexa:${POSTGRES_PASSWORD:-goalnexa}@db:5432/goalnexa}
    DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
    GOALNEXA_EXTENSIONS: ${GOALNEXA_EXTENSIONS:-}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    AUTH_LOGIN_RATE: ${AUTH_LOGIN_RATE:-10/min}
    AUTH_LOGIN_EMAIL_RATE: ${AUTH_LOGIN_EMAIL_RATE:-20/hour}
    AUTH_SIGNUP_RATE: ${AUTH_SIGNUP_RATE:-10/hour}
    TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goalnexa
      POSTGRES_USER: goalnexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goalnexa}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "goalnexa", "-d", "goalnexa"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-off: applies migrations (and seeds RBAC roles), creates the
  # cache table the auth rate limits count in, then exits.
  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py createcachetable"]
    depends_on:
      db:
        condition: service_healthy

  main-backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Django answers only its ALLOWED_HOSTS, so probe with the first one
    # as the Host header (a leading "." wildcard is dropped).
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip().lstrip('.'); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/admin/login/', headers={'Host': host}))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  main-frontend:
    build:
      context: .
      dockerfile: apps/main/frontend/Dockerfile
    image: goalnexa-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      main-backend:
        condition: service_healthy
      main-frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-55607}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
