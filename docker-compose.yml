# Runs apps/main behind a single external port (nginx) - see
# nginx/default.conf: /api/* and /admin/* go to the backend, everything
# else to the frontend. main-backend/main-frontend have no host port of
# their own; only nginx is exposed.
services:
  main-backend:
    image: python:3.12-slim
    working_dir: /apps/main/backend
    environment:
      # From .env (see .env.sample) - set real values before exposing the
      # app publicly (Tailscale Funnel); the fallbacks are dev-only.
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret}
      DJANGO_ALLOWED_HOSTS: "*"
      # Without this, Python buffers stdout and `docker compose logs`
      # shows NOTHING even while the server is running fine - confirmed
      # directly during development (had to exec in and check /proc to
      # find the real, silently-running process).
      PYTHONUNBUFFERED: "1"
    # Mounts the whole apps/ tree, not just apps/main/backend: platform_auth
    # is installed editable from the sibling apps/platform-auth/backend
    # directory (see the backend rule in root AGENTS.md, mirroring the
    # frontend's file: dependency) - that path has to exist in the
    # container too, at the same relative position.
    volumes:
      - ./apps:/apps
      - main-backend-venv:/apps/main/backend/.venv
    command: >
      sh -c "
      python -m venv .venv &&
      . .venv/bin/activate &&
      pip install --no-cache-dir -q -r requirements.txt -e /apps/platform-core/backend -e /apps/platform-auth/backend -e /apps/platform-org/backend -e /apps/goalnexa/backend -e /apps/platform-mcp/backend &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    # First boot can take minutes (compiling argon2-cffi/psycopg from
    # source if no prebuilt wheel matches this image) - a generous
    # retry budget, not a short one. Without this healthcheck, nginx's
    # plain `depends_on` only waits for the CONTAINER to start, not the
    # app inside it to actually be ready; nginx resolves an upstream
    # hostname ONCE at its own startup, so starting before this is ready
    # means every request 502s until nginx itself is restarted, even
    # once the backend comes up on its own.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/')"]
      interval: 3s
      timeout: 3s
      retries: 100
      start_period: 5s

  main-frontend:
    image: node:22
    working_dir: /apps/main/frontend
    environment:
      # Extra Host names the Vite dev server accepts (see vite.config.ts) -
      # ".ts.net" covers the Tailscale MagicDNS name. Add a bare machine
      # name here to use the short form (http://<machine>:55607).
      FRONTEND_ALLOWED_HOSTS: ".ts.net"
      # "production" (from .env) = `react-router build` then serve the
      # built app (no HMR, minified, no /@fs source); anything else = the
      # Vite dev server with hot reload.
      FRONTEND_MODE: ${FRONTEND_MODE:-dev}
      PORT: "3000"
    depends_on:
      - main-backend
    # Mounts the whole apps/ tree, not just apps/main/frontend: main's
    # package.json depends on platform-auth-frontend via a relative
    # `file:../../platform-auth/frontend` path (see the frontend rule in
    # root AGENTS.md), so that sibling directory has to be present in the
    # container too, at the same relative position, for npm's symlink to
    # resolve.
    volumes:
      - ./apps:/apps
      - main-frontend-node-modules:/apps/main/frontend/node_modules
    # rm -f package-lock.json / retry dance: works around a documented npm
    # bug (npm/cli#4828) where an optional native dependency
    # (@rollup/rollup-*) intermittently fails to install.
    command: >
      sh -c "
      rm -f package-lock.json &&
      npm install &&
      (node -e \"require('rollup')\" || npm install --force) &&
      if [ \"$$FRONTEND_MODE\" = production ]; then
        npm run build && NODE_ENV=production npm run start;
      else
        npm run dev -- --host 0.0.0.0 --port 3000;
      fi
      "

  nginx:
    image: nginx:alpine
    depends_on:
      main-backend:
        condition: service_healthy
      main-frontend:
        condition: service_started
    ports:
      - "55607:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Optional: puts the app on your Tailscale tailnet as its own device,
  # https://<TS_HOSTNAME>.<tailnet>.ts.net -> nginx - and on the PUBLIC
  # internet too, via Funnel (tailscale/serve.json's AllowFunnel). Opt-in, since it
  # needs an auth key: put TS_AUTHKEY=tskey-auth-... in .env (gitignored),
  # then `docker compose --profile tailscale up -d`. Userspace networking,
  # so no /dev/net/tun or extra privileges. `tailscale serve` keeps the
  # browser's Host header, which the ".ts.net" allowlist (main-frontend's
  # FRONTEND_ALLOWED_HOSTS, Django's DJANGO_ALLOWED_HOSTS) accepts.
  tailscale:
    image: tailscale/tailscale:latest
    profiles: ["tailscale"]
    hostname: ${TS_HOSTNAME:-goalnexa}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-goalnexa}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  tailscale-state:
  main-frontend-node-modules:
  main-backend-venv:
