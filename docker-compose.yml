services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goalnexa
      POSTGRES_PASSWORD: goalnexa
      POSTGRES_DB: goalnexa
    ports:
      - "5432:5432"
    volumes:
      - goalnexa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalnexa"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://goalnexa:goalnexa@postgres:5432/goalnexa
      JWT_SECRET: dev-secret-change-me
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_DAYS: "30"
      CORS_ORIGINS: '["http://localhost:30566"]'
      APP_BASE_URL: http://localhost:30566
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: sh -c "pip install -e '.[dev]' --quiet && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - goalnexa-frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "30566:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  goalnexa-postgres-data:
  goalnexa-frontend-node-modules:
