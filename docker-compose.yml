services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goalnexa
      POSTGRES_PASSWORD: goalnexa
      POSTGRES_DB: goalnexa
    ports:
      - "5432:5432"
    volumes:
      - goalnexa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalnexa"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://goalnexa:goalnexa@postgres:5432/goalnexa
      JWT_SECRET: dev-secret-change-me
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_DAYS: "30"
      APP_BASE_URL: http://localhost:30566
    working_dir: /app
    # Bind-mounts the whole repo root (not just ./backend) — this service
    # needs the platform-core submodule alongside backend/ (see
    # backend/README.md's "consume in place" note), same layout the
    # Dockerfile's own build already assumes.
    volumes:
      - .:/app
    command: >
      sh -c "
      pip install -e ./platform-core/backend --quiet &&
      pip install -e './backend[dev]' --quiet &&
      (cd platform-core/backend && alembic upgrade head) &&
      (cd backend && alembic upgrade head) &&
      cd backend &&
      uvicorn goalnexa_ext.asgi:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    image: node:20
    working_dir: /app/frontend
    depends_on:
      - backend
    volumes:
      - .:/app
      - goalnexa-frontend-node-modules:/app/frontend/node_modules
      # Shadows platform-core/frontend/node_modules with a container-only
      # volume rather than letting `scripts/link-platform-core-node-modules.mjs`
      # write a symlink into the bind-mounted submodule checkout — that
      # symlink would point at a container-internal path
      # (/app/frontend/node_modules) that dangles the moment you ran
      # anything against this checkout outside Docker. Docker creates this
      # mount point as an empty real directory; the postinstall script
      # specifically handles "empty directory here" as safe to replace with
      # its own symlink (see that script's own comment).
      - goalnexa-platform-core-frontend-node-modules:/app/platform-core/frontend/node_modules
    # `rm -f package-lock.json` before install: a documented npm bug
    # (npm/cli#4828) can leave a lockfile generated on one platform (this
    # repo's committed one was generated on macOS/arm64) missing the correct
    # platform-specific optional dependency entry (@rollup/rollup-*, esbuild's
    # native binary) when `npm install` runs against it on a different
    # platform. This mutates the bind-mounted host package-lock.json too
    # (harmless - the regenerated lockfile is still deterministic from
    # package.json, just now correctly multi-platform).
    #
    # The `node -e "require('rollup')" || ...` retry after it is a second,
    # independent layer of defense: the linked npm issue describes this
    # specific failure as genuinely non-deterministic (an optional dependency
    # silently failing to install isn't always reproducible even with an
    # otherwise-identical lockfile/base-image/npm-version) - confirmed
    # directly during development, where a clean `rm -f package-lock.json &&
    # npm install` sometimes produced a working `node_modules` and sometimes
    # didn't, with no other variable changed. `npm install --force` (not
    # deleting node_modules first) is deliberate: node_modules lives in a
    # named volume here, and Docker Desktop for Mac's volume driver can
    # leave root-owned entries a plain `rm -rf` can't clear even as root
    # inside the container - `--force` reinstalls/overwrites in place
    # instead, sidestepping that entirely. Cheap here (dev-only, runs once
    # per container start), turning an occasional crash-loop into an
    # occasional few-extra-seconds delay.
    command: >
      sh -c "
      rm -f package-lock.json &&
      npm install &&
      (node -e \"require('rollup')\" || npm install --force) &&
      npm run dev -- --host 0.0.0.0
      "

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "30566:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  goalnexa-postgres-data:
  goalnexa-frontend-node-modules:
  goalnexa-platform-core-frontend-node-modules:
