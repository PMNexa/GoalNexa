# Serves the whole platform for local dev: platform-auth (backend+frontend)
# and platform-core (backend+frontend), wired together via modules.yaml.
#
# No single external entrypoint yet (see docs/architecture/
# microservices-design.md - a real gateway is future work) - each
# service is exposed on its own host port directly. This actually matches
# how the pieces work today: platform-core's frontend hands the browser
# off to another module's frontend_url via a full page navigation, which
# only works if that URL is something the browser can reach directly.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: platform_auth
      POSTGRES_PASSWORD: platform_auth_dev_password
      POSTGRES_DB: platform_auth
    ports:
      - "5432:5432"
    volumes:
      - platform-auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_auth"]
      interval: 2s
      timeout: 3s
      retries: 20

  platform-auth-backend:
    build:
      context: ./apps/platform-auth/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-secret-change-me
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://platform_auth:platform_auth_dev_password@postgres:5432/platform_auth
      JWT_SECRET: dev-secret-change-me
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_DAYS: "30"
    ports:
      - "8001:8000"
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  platform-auth-frontend:
    image: node:20
    working_dir: /app
    depends_on:
      - platform-auth-backend
    environment:
      VITE_API_BASE_URL: http://localhost:8001
    volumes:
      - ./apps/platform-auth/frontend:/app
      - platform-auth-frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    # rm -f package-lock.json / retry dance: works around a documented npm
    # bug (npm/cli#4828) where an optional native dependency
    # (@rollup/rollup-*) intermittently fails to install.
    command: >
      sh -c "
      rm -f package-lock.json &&
      npm install &&
      (node -e \"require('rollup')\" || npm install --force) &&
      npm run dev -- --host 0.0.0.0
      "

  platform-core-backend:
    build:
      context: ./apps/platform-core/backend
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-secret-change-me
      DJANGO_ALLOWED_HOSTS: "*"
      MODULES_MANIFEST_PATH: /modules.yaml
    volumes:
      - ./modules.yaml:/modules.yaml:ro
    ports:
      - "8000:8000"

  platform-core-frontend:
    image: node:20
    working_dir: /app
    depends_on:
      - platform-core-backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./apps/platform-core/frontend:/app
      - platform-core-frontend-node-modules:/app/node_modules
    ports:
      - "5174:5174"
    command: >
      sh -c "
      rm -f package-lock.json &&
      npm install &&
      (node -e \"require('rollup')\" || npm install --force) &&
      npm run dev -- --host 0.0.0.0 --port 5174
      "

volumes:
  platform-auth-postgres-data:
  platform-auth-frontend-node-modules:
  platform-core-frontend-node-modules:
