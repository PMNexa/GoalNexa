# Runs apps/main behind a single external port (nginx) - see
# nginx/default.conf: /api/* and /admin/* go to the backend, everything
# else to the frontend. main-backend/main-frontend have no host port of
# their own; only nginx is exposed.
services:
  main-backend:
    image: python:3.12-slim
    working_dir: /apps/main/backend
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-secret-change-me
      DJANGO_ALLOWED_HOSTS: "*"
    # Mounts the whole apps/ tree, not just apps/main/backend: platform_auth
    # is installed editable from the sibling apps/platform-auth/backend
    # directory (see the backend rule in root AGENTS.md, mirroring the
    # frontend's file: dependency) - that path has to exist in the
    # container too, at the same relative position.
    volumes:
      - ./apps:/apps
      - main-backend-venv:/apps/main/backend/.venv
    command: >
      sh -c "
      python -m venv .venv &&
      . .venv/bin/activate &&
      pip install --no-cache-dir -q -r requirements.txt -e /apps/platform-auth/backend -e /apps/platform-org/backend &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  main-frontend:
    image: node:22
    working_dir: /apps/main/frontend
    depends_on:
      - main-backend
    # Mounts the whole apps/ tree, not just apps/main/frontend: main's
    # package.json depends on platform-auth-frontend via a relative
    # `file:../../platform-auth/frontend` path (see the frontend rule in
    # root AGENTS.md), so that sibling directory has to be present in the
    # container too, at the same relative position, for npm's symlink to
    # resolve.
    volumes:
      - ./apps:/apps
      - main-frontend-node-modules:/apps/main/frontend/node_modules
    # rm -f package-lock.json / retry dance: works around a documented npm
    # bug (npm/cli#4828) where an optional native dependency
    # (@rollup/rollup-*) intermittently fails to install.
    command: >
      sh -c "
      rm -f package-lock.json &&
      npm install &&
      (node -e \"require('rollup')\" || npm install --force) &&
      npm run dev -- --host 0.0.0.0 --port 3000
      "

  nginx:
    image: nginx:alpine
    depends_on:
      - main-backend
      - main-frontend
    ports:
      - "55607:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  main-frontend-node-modules:
  main-backend-venv:
