# Production deploy: every push to the `deploy` branch (a merged PR
# counts) builds both images, tags them with the commit, pushes them to
# the registry and rolls them out to the Swarm with scripts/deploy.sh
# (migrate, then `docker stack deploy`; a failed healthcheck rolls back
# and turns this run red).
#
# Release = open a PR main -> deploy and merge it. ci.yml runs on that PR;
# make it a required check in the `deploy` branch's protection rules so
# nothing untested ships. Rollback = "Run workflow" here with an earlier
# commit's 12-char tag: deploys that image, no build.
#
# Registry: both images go to ONE repository, `goalnexa`, as
# backend-<commit> / frontend-<commit> - the free Starter plan allows one
# repository and 500 MB. Before each build, every release is deleted and
# garbage-collected except the one the Swarm is running (the rollback
# target once this one is out) and the KEEP_RELEASES newest others (repo
# variable, default 0).
#
# Setup (repo Settings):
#   Variables (repository level - the job's `if` can't see environment
#   ones): REGISTRY (registry.digitalocean.com/<name>), DEPLOY_HOST
#   (user@manager-ip; user in the docker group). Unset = this workflow
#   does nothing (forks, the hosted edition until it sets its own).
#   Environment `production` secrets: PROD_ENV (the whole env file, the
#   keys docker-stack.yml reads), DO_REGISTRY_TOKEN (DigitalOcean API
#   token with registry create/read/update/delete - delete for the
#   cleanup), DEPLOY_SSH_KEY (private key for
#   DEPLOY_HOST), DEPLOY_KNOWN_HOSTS (`ssh-keyscan <manager-ip>` output).
#   Optional: required reviewers on the environment, for a manual gate.
name: Deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (12-char commit) - empty builds this branch's HEAD"
        required: false

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.REGISTRY != '' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ${{ vars.REGISTRY }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH to the Swarm manager
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config

      # A DigitalOcean API token is both the username and the password.
      - uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - uses: digitalocean/action-doctl@v2
        if: steps.tag.outputs.build == 'true'
        with:
          token: ${{ secrets.DO_REGISTRY_TOKEN }}

      # Frees space before pushing. Garbage collection makes the registry
      # read-only while it runs, so wait for it (and for one still running
      # from elsewhere) before the build pushes.
      - name: Remove old releases from the registry
        if: steps.tag.outputs.build == 'true'
        env:
          KEEP: ${{ vars.KEEP_RELEASES || '0' }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          # The release the Swarm runs now - read from the Swarm, not the
          # registry, since the newest pushed one may have rolled back.
          # Unreachable manager = stop here rather than guess.
          docker -H "ssh://$DEPLOY_HOST" info >/dev/null
          running="$(docker -H "ssh://$DEPLOY_HOST" service inspect goalnexa_main-backend \
            --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null \
            | sed -n 's/.*:backend-\([0-9a-f]*\).*/\1/p')" || running=""
          echo "Running: ${running:-nothing yet}"

          wait_gc() {
            for _ in $(seq 90); do
              doctl registry garbage-collection get-active >/dev/null 2>&1 || return 0
              sleep 10
            done
            echo "Garbage collection still running after 15 min" >&2
            return 1
          }
          wait_gc
          old="$(doctl registry repository list-tags goalnexa -o json 2>/dev/null | jq -r --arg tag "$TAG" --arg running "$running" --argjson keep "$KEEP" '
            map(select(.tag | test("^(backend|frontend)-")))
            | map({sha: (.tag | sub("^[a-z]+-"; "")), at: .updated_at})
            | map(select(.sha != $tag and .sha != $running))
            | group_by(.sha) | map({sha: .[0].sha, at: (map(.at) | max)})
            | sort_by(.at) | reverse | .[$keep:] | .[].sha')" || old=""
          [ -n "$old" ] || { echo "Nothing to remove"; exit 0; }
          for sha in $old; do
            echo "Removing release $sha"
            doctl registry repository delete-tag goalnexa "backend-$sha" --force || true
            doctl registry repository delete-tag goalnexa "frontend-$sha" --force || true
          done
          doctl registry garbage-collection start --include-untagged-manifests --force
          wait_gc

      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.build == 'true'

      - name: Build backend
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/main/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/goalnexa:backend-${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/main/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/goalnexa:frontend-${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Env file from the secret, then the repo variables (later lines win
      # when scripts/deploy.sh sources it).
      - name: Deploy
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ENV_FILE="$RUNNER_TEMP/production.env"
          {
            printf '%s\n' "$PROD_ENV"
            printf 'REGISTRY=%s\nDEPLOY_HOST=%s\n' "$REGISTRY" "$DEPLOY_HOST"
          } > "$ENV_FILE"
          ENV_FILE="$ENV_FILE" scripts/deploy.sh "$TAG"

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/id_deploy "$RUNNER_TEMP/production.env"
