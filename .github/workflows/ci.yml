# The whole app as apps/main runs it: every module at the submodule
# commits this repo pins, on every push to main and every PR. Each
# platform-* repo has its own CI for its standalone suite; this one checks
# they work together (tenant isolation, RBAC, MCP) and that main builds.
#
# Only runs in the public repo: the private hosted fork merges this file
# in too, and there it would spend private-repo minutes on code already
# tested here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.repository == 'PMNexa/GoalNexa'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/main/backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: >
          pip install -r requirements.txt
          -e ../../platform-core/backend -e ../../platform-auth/backend
          -e ../../platform-org/backend -e ../../goalnexa/backend
          -e ../../platform-mcp/backend
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Test
        run: python manage.py test tests platform_auth platform_org goalnexa platform_mcp
        env:
          DJANGO_ALLOWED_HOSTS: localhost,testserver

  frontend:
    if: github.repository == 'PMNexa/GoalNexa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # main depends on every module's frontend as a file: package, whose
      # own imports resolve from that package's node_modules.
      - name: Install module packages
        run: |
          for module in platform-core platform-auth platform-org platform-mcp goalnexa; do
            (cd "apps/$module/frontend" && npm ci)
          done
      - name: Lint and build goalnexa-frontend
        working-directory: apps/goalnexa/frontend
        run: npm run lint && npm run build
      # Same as docker-compose.yml: main's lockfile was made on macOS and
      # lacks Linux's native rolldown binding (npm/cli#4828), so install
      # fresh rather than `npm ci`.
      - name: Install main
        working-directory: apps/main/frontend
        run: rm -f package-lock.json && npm install
      - name: Typecheck main
        working-directory: apps/main/frontend
        run: npm run typecheck
      - name: Build main
        working-directory: apps/main/frontend
        run: npm run build

  # An install of the oldest supported release (.github/upgrade-from),
  # with the demo data in it, upgraded to this commit on Postgres: its
  # migrations apply, the data comes through unchanged, the suite passes
  # (scripts/upgrade_test.sh; docs/upgrading.md).
  upgrade:
    if: github.repository == 'PMNexa/GoalNexa'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: goalnexa
          POSTGRES_USER: goalnexa
          POSTGRES_PASSWORD: goalnexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goalnexa" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Which release to upgrade from
        id: from
        run: echo "ref=$(cat .github/upgrade-from)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.from.outputs.ref }}
          submodules: recursive
          path: upgrade-from
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Upgrade ${{ steps.from.outputs.ref }} to this commit
        run: scripts/upgrade_test.sh upgrade-from .
        env:
          DATABASE_URL: postgres://goalnexa:goalnexa@localhost:5432/goalnexa

  # The production images (docker-compose.prod.yml) still build.
  images:
    if: github.repository == 'PMNexa/GoalNexa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build backend image
        run: docker build -f apps/main/backend/Dockerfile -t goalnexa-backend .
      - name: Build frontend image
        run: docker build -f apps/main/frontend/Dockerfile -t goalnexa-frontend .
